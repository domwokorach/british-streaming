global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels: { env: local, service: worldstreaming-web }

rule_files: [/etc/prometheus/rules/*.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: web
    metrics_path: /api/metrics
    authorization: { type: Bearer, credentials: local-metrics-token } # matches compose default; use credentials_file in real envs
    static_configs: [{ targets: ["web:3000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
