name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      change_type:
        description: "Used by the error-budget gate (feature | hotfix | security | reliability | rollback)"
        default: feature
      image_digest:
        description: "Deploy this existing digest (sha256:...) instead of building; use for rollbacks"
        required: false
concurrency:
  group: deploy-main # serialise deploys; never cancel one mid-flight
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write # short-lived OIDC credentials; no static AWS keys anywhere
env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !inputs.image_digest }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.ECR_REPOSITORY_URL }}@${{ steps.push.outputs.digest }}
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
        env: { AWS_REGION: "${{ env.AWS_REGION }}" }

  dev:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      image_digest: ${{ inputs.image_digest || needs.build.outputs.digest }}
      change_type: ${{ inputs.change_type || 'feature' }}
    secrets: inherit

  staging:
    needs: [build, dev]
    if: ${{ always() && needs.dev.result == 'success' }}
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
      image_digest: ${{ inputs.image_digest || needs.build.outputs.digest }}
      change_type: ${{ inputs.change_type || 'feature' }}
    secrets: inherit

  production:
    needs: [build, staging]
    if: ${{ always() && needs.staging.result == 'success' }}
    uses: ./.github/workflows/_deploy-env.yml # the `production` GitHub environment requires reviewer approval
    with:
      environment: production
      image_digest: ${{ inputs.image_digest || needs.build.outputs.digest }}
      change_type: ${{ inputs.change_type || 'feature' }}
    secrets: inherit
