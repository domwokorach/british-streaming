name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Ops config and SLO tests
        run: npm run test:ops
      - name: Scroll-motion unit tests
        run: npm run test:motion
      - name: SLO rules are up to date
        run: npm run slo:rules:check
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      - uses: actions/upload-artifact@v7
        with: { name: next-cache, path: .next/cache, retention-days: 1 }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      - name: Responsive, navigation, hero, accessibility and API tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          # Optional: with a TMDB token the hero-carousel tests run; without one they skip.
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  secrets-and-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret detection
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependency vulnerability scan (high+ fails the build)
        run: npm audit --audit-level=high --omit=dev
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6
        with: { configFile: .commitlintrc.json }

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every root
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/envs/*; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: IaC security scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: infra/terraform, severity: "HIGH,CRITICAL", exit-code: "1" }

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: error }
      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: worldstreaming:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "worldstreaming:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - name: Container smoke test (health, readiness, metrics)
        run: bash scripts/ci/smoke-container.sh worldstreaming:ci
